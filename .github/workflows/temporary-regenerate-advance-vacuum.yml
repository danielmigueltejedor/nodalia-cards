name: Regenerate Advance Vacuum assets (temporary)
on:
  push:
    branches:
      - fix/advance-vacuum-image-map-calibration
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/advance-vacuum-image-map-calibration
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate committed assets
        run: pnpm run i18n:gen-editor && pnpm run i18n:gen-runtime && pnpm run bundle
      - name: Commit generated artifacts to the fix branch
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'Generated files already match the source.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(vacuum): synchronize generated assets for image map calibration'
          git push origin HEAD:fix/advance-vacuum-image-map-calibration
