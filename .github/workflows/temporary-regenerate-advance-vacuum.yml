name: Regenerate and test Advance Vacuum alpha.2 assets (temporary)
on:
  push:
    branches:
      - fix/advance-vacuum-image-map-calibration
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/advance-vacuum-image-map-calibration
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate assets
        run: pnpm run version:sync && pnpm run i18n:gen-editor && pnpm run i18n:gen-runtime && pnpm run bundle
      - name: Commit generated assets to the fix branch
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'Generated files already match source.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(vacuum): regenerate alpha.2 assets after initialization fix'
            git push origin HEAD:fix/advance-vacuum-image-map-calibration
          fi
      - name: Install Chromium and dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser regression for room marker initialization
        run: pnpm exec playwright test tests/browser/advance-vacuum-room-marker-initialization.spec.mjs --project=chromium --workers=1
