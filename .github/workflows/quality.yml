name: Quality gates
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate; defaults to the caller's commit
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate translations
        run: pnpm run i18n:gen-editor && pnpm run i18n:gen-runtime
      - name: Lint, strict types, build and unit tests
        run: pnpm run validate:fast
      - name: Generated artifacts must match the commit
        run: git diff --exit-code
  browsers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, os: ubuntu-latest }
          - { project: firefox, os: ubuntu-latest }
          - { project: webkit, os: macos-latest }
          - { project: webkit-iphone, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Use the primary Ubuntu package archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The Azure mirror can stall browser dependency downloads for 20+ minutes.
          # Keep the Ubuntu suites, signing keys and security archive unchanged.
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$apt_source_file" ]]; then
              sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$apt_source_file"
            fi
          done
      - name: Install browser and system dependencies
        shell: bash
        run: |
          engine="${{ matrix.project }}"
          if [[ "$engine" == "webkit-iphone" ]]; then engine=webkit; fi
          pnpm exec playwright install --with-deps "$engine"
      - run: pnpm run build
      - name: Browser, editor, layout and accessibility regressions
        # The four engines already run in separate jobs. Bound each runner's
        # browser load instead of launching two WebKit workers concurrently.
        run: pnpm exec playwright test --project=${{ matrix.project }} --workers=1
