name: Quality gates
on:
  workflow_call:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate translations
        run: pnpm run i18n:gen-editor && pnpm run i18n:gen-runtime
      - name: Lint, strict types, build and unit tests
        run: pnpm run validate:fast
      - name: Generated artifacts must match the commit
        run: git diff --exit-code
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, webkit-iphone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser and system dependencies
        shell: bash
        run: |
          engine="${{ matrix.project }}"
          if [[ "$engine" == "webkit-iphone" ]]; then engine=webkit; fi
          pnpm exec playwright install --with-deps "$engine"
      - run: pnpm run build
      - name: Browser, editor, layout and accessibility regressions
        run: pnpm exec playwright test --project=${{ matrix.project }}
