name: Prepare alpha 7 assets (temporary)
on:
  push:
    branches:
      - fix/alpha7-consistent-icon-title-spacing
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'prepare alpha7 assets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare alpha.7 with versioned bundles
        run: |
          pnpm run release:alpha
          pnpm run i18n:gen-editor
          pnpm run i18n:gen-runtime
          pnpm run validate:fast
          test "$(node -p 'require("./package.json").version')" = '3.0.4-alpha.7'
      - name: Push verified bundles back to review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build(release): 3.0.4-alpha.7 and generated bundles"
          git push origin HEAD:refs/heads/fix/alpha7-consistent-icon-title-spacing
