name: Temporary deterministic bundle regeneration

on:
  push:
    branches: [fix/axe-4-14-person-accessible-name]

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, 'temporary distribution regeneration')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Rebuild all generated files with locked tooling
        run: |
          pnpm install --frozen-lockfile
          pnpm run i18n:gen-editor
          pnpm run i18n:gen-runtime
          pnpm run validate:fast
      - name: Commit exact reproducible output
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: commit verified generated distribution"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
