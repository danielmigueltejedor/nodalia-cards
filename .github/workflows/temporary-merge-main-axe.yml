name: Temporary reconcile Axe upgrade with current main

on:
  push:
    branches: [fix/axe-4-14-person-accessible-name]

permissions:
  contents: write

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, 'temporary main reconciliation')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate current main, prefer main for generated conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs --no-edit origin/main
          node -e 'const p=require("./package.json"); if(p.devDependencies["@axe-core/playwright"]!=="4.14.0")process.exit(1)'
          grep -q 'const actionLabel = \[title, subtitle\].filter(Boolean).join(" ");' src/cards/person/person-card.ts
          grep -q 'expect(accessibleLabel).toContain(visibleStatus)' tests/browser/nodalia-browser.spec.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Rebuild and validate merged code
        run: |
          pnpm install --frozen-lockfile
          pnpm run i18n:gen-editor
          pnpm run i18n:gen-runtime
          pnpm run validate:fast
      - name: Commit generated files on top of main
        run: |
          set -euo pipefail
          git add -u
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "build: regenerate Axe 4.14 distribution after main sync"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
