name: Recover alpha 6 after TV regression fix (one-time)
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  recover:
    if: contains(github.event.head_commit.message, 'alpha6 fixture recovery')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify corrected alpha 6 bundle and tests
        run: |
          test "$(node -p 'require("./package.json").version')" = '3.0.4-alpha.6'
          pnpm run validate:fast
          git diff --exit-code
      - name: Cancel old release and retag only if still unpublished
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v3.0.4-alpha.6
          old_sha='cd18e12bbde5979d2d02a597ac1c740ab5c6747e'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release has been published; do not rewrite a public version." >&2
            exit 1
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          if [[ "$actual" != "$old_sha" ]]; then
            echo "Unexpected existing tag $actual; refusing to overwrite." >&2
            exit 1
          fi
          gh run cancel 40118547983 || true
          for index in {1..100}; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40118547983" --jq '.status')"
            if [[ "$status" == "completed" ]]; then break; fi
            sleep 5
          done
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40118547983" --jq '.status')"
          if [[ "$status" != "completed" ]] || gh release view "$tag" >/dev/null 2>&1; then
            echo "Old release still active or already published; refusing to move tag." >&2
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
          gh workflow run release.yml --ref main -f tag="$tag"
