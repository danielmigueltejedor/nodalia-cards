name: Prepare TV and Fav artifacts (temporary)
on:
  push:
    branches: [fix/tv-titles-and-fav-alarm-centering]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate bundles and validate source
        run: pnpm run validate:fast
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Regression checks - TV title and Fav alarm placement
        run: pnpm exec playwright test tests/browser/media-player-lifecycle.spec.mjs tests/browser/fav-card.spec.mjs --grep 'TV mode names|Fav 6-column alarm' --project=chromium --workers=1
      - name: Commit generated bundle files on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: rebuild TV and Fav browser assets'
            git push origin HEAD:refs/heads/fix/tv-titles-and-fav-alarm-centering
          fi
