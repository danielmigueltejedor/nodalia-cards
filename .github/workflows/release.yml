name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag and package version
        run: node -e 'const p=require("./package.json"); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ""); if (p.version !== tag) throw new Error(`Tag ${tag} does not match package ${p.version}`)'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate
        run: |
          pnpm run i18n:gen-editor
          pnpm run i18n:gen-runtime
          pnpm run validate
          git diff --exit-code

      - name: Validate release assets and generate metadata
        run: pnpm run release:metadata

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
          sbom-path: release/nodalia-cards.sbom.cdx.json

      - name: Publish verified release assets
        shell: bash
        run: |
          mapfile -t assets < release/release-assets.txt
          release_title="${GITHUB_REF_NAME#v}"
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes --title "$release_title" "${prerelease_args[@]}"
