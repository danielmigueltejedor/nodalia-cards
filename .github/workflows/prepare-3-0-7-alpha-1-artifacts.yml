# One-off artifact preparation for PR #389; delete after generated assets are committed.
name: Prepare 3.0.7-alpha.1 generated bundles
on:
  push:
    branches:
      - fix/3.0.7-alpha.1-advance-vacuum-room-markers
    paths:
      - .github/workflows/prepare-3-0-7-alpha-1-artifacts.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run i18n:gen-editor && pnpm run i18n:gen-runtime && pnpm run version:check && pnpm run bundle
      - name: Commit generated JavaScript and manifest to PR branch
        shell: bash
        run: |
          git add -- nodalia-*.js tests/fixtures/hass.mjs
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes in generated artifacts"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: regenerate 3.0.7-alpha.1 distributable bundles"
          git push origin HEAD:fix/3.0.7-alpha.1-advance-vacuum-room-markers
