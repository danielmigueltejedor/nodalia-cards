name: Recover unpublished alpha 5 (one-time)
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  recover:
    if: contains(github.event.head_commit.message, 'iOS slider fix trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and validate corrected assets
        run: |
          test "$(node -p 'require("./package.json").version')" = "3.0.4-alpha.5"
          pnpm run validate:fast
      - name: Commit generated bundles on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate verified iOS slider assets"
            git push origin HEAD:refs/heads/main
          fi
      - name: Safely recover the unpublished tag and restart official release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v3.0.4-alpha.5'
          expected='a6a0ab013be3e965929b673003c736ab898d4455'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Cannot modify a published tag" >&2
            exit 1
          fi
          old="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          if [[ "$old" != "$expected" ]]; then
            echo "Tag changed unexpectedly: $old" >&2
            exit 1
          fi
          gh run cancel 40114593675 || true
          stopped=0
          for index in {1..80}; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40114593675" --jq '.status')"
            if [[ "$state" == 'completed' ]]; then
              stopped=1
              break
            fi
            sleep 5
          done
          if [[ "$stopped" != 1 ]]; then
            echo 'Earlier release run did not stop safely' >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Earlier run unexpectedly published; refusing to move tag" >&2
            exit 1
          fi
          next="$(git rev-parse HEAD)"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
            -f sha="$next" -F force=true
          gh workflow run release.yml --ref main -f tag="$tag"
          echo "Revalidated unpublished $tag now targets $next"
