name: Publish TV/Fav alpha 6 (one-time)
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'release alpha6 preparation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare and validate version 3.0.4-alpha.6
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "3.0.4-alpha.5"
          pnpm run release:alpha
          test "$(node -p 'require("./package.json").version')" = "3.0.4-alpha.6"
          pnpm run validate:fast
          git diff --check
          # Keep this disposable publishing workflow out of the tagged source.
          rm .github/workflows/alpha6-prepare-once.yml
      - name: Commit versioned assets and launch tagged quality-gated release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to tag'; exit 1; }
          git commit -m 'chore(release): prepare 3.0.4-alpha.6 and compiled bundles'
          git push origin HEAD:refs/heads/main
          tag='v3.0.4-alpha.6'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing release tag' >&2
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$(git rev-parse HEAD)"
          # GITHUB_TOKEN-created tags do not trigger push actions. Dispatch the
          # official release workflow, which validates all four browser engines.
          gh workflow run release.yml --ref main -f tag="$tag"
