name: Alpha 5 preparation (temporary)

on:
  push:
    branches:
      - fix/camera-lock-tv-metadata-alpha5

permissions:
  contents: write

jobs:
  prepare:
    # The GitHub token's bot-authored commit will not retrigger this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare and compile versioned alpha artifacts
        run: |
          pnpm run release:alpha
          pnpm run i18n:gen-editor
          pnpm run i18n:gen-runtime
          pnpm run validate:fast
          node -e 'if(require("./package.json").version!=="3.0.4-alpha.5") process.exit(1)'
      - name: Commit validated version and bundles to this review branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): prepare 3.0.4-alpha.5 with generated bundles"
          git push origin "HEAD:refs/heads/fix/camera-lock-tv-metadata-alpha5"
