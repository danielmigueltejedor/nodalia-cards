<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nodalia browser tests</title>
    <style>
      body { background: #111318; color: #fff; font-family: sans-serif; margin: 0; padding: 24px; }
      #fixture { display: grid; gap: 16px; max-width: 720px; }
    </style>
    <script>
      window.bundleErrors = [];
      window.addEventListener("error", event => {
        window.bundleErrors.push(`${event.message} @ ${event.filename}:${event.lineno}:${event.colno}`);
      });
      for (const tag of ["ha-card", "ha-icon"]) {
        if (!customElements.get(tag)) customElements.define(tag, class extends HTMLElement {});
      }
      window.makeHass = states => ({
        states,
        locale: { language: "en" },
        language: "en",
        config: { unit_system: { temperature: "°C", length: "km", wind_speed: "km/h" } },
        callService: async () => {},
        callWS: async () => ({ children: [] }),
        hassUrl: path => path,
      });
    </script>
    <script type="module" src="/nodalia-cards.js"></script>
  </head>
  <body>
    <main id="fixture" aria-label="Nodalia test fixture"></main>
  </body>
</html>
